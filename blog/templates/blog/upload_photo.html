{% extends 'base.html' %}

{% block content %}

<div class="login-card">

    <h2>Upload Photo</h2>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}
        
        <button type="submit">
            Upload
        </button>

    </form>

</div>

{% endblock %}
